[project]
name = "public-records-research-backend"
version = "0.1.0"
description = "Backend for the Public Records Research MVP"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.1",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.1",
    "redis>=5.0",
    "celery>=5.3",
    "httpx>=0.27",
    "feedparser>=6.0",
    "pandas>=2.2",
    "pypdf>=4.2",
    "rapidfuzz>=3.9",
    "python-dateutil>=2.9",
    "openai>=1.30",
    "langgraph>=0.2",
    "pgvector>=0.3",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10", "pymupdf>=1.24", "Pillow>=10.3"]
nlp = ["spacy>=3.7"]
address = ["usaddress>=0.5.10"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-python-dateutil",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["app/tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
